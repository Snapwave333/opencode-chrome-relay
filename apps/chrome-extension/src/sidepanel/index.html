<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>OpenCode Chrome Relay</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Animated background: 4 drifting color fields + shimmer; colors follow the agent's state -->
  <div class="aura" id="aura" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
    <span class="frost"></span>
  </div>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <!-- OpenCode mark (same glyph as the desktop app icon) -->
        <span class="brand-mark" aria-label="OpenCode Relay" title="OpenCode Relay">
          <svg viewBox="0 0 512 512" width="18" height="18" aria-hidden="true">
            <rect width="512" height="512" rx="96" fill="#131010"/>
            <path d="M320 224V352H192V224H320Z" fill="#5A5858"/>
            <path fill-rule="evenodd" d="M384 416H128V96H384V416ZM320 160H192V352H320V160Z" fill="#fff"/>
          </svg>
        </span>
        <span id="model-name" class="model" role="status" aria-live="polite"></span>
      </div>
      <button id="btn-new-session" class="icon-btn" title="New chat" aria-label="New chat"></button>
    </header>

    <main class="timeline-container" id="timeline" tabindex="-1">
      <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
    </main>

    <footer class="composer">
      <textarea id="steer-input" rows="1" maxlength="4000" placeholder="Ask about this page…" aria-label="Message"></textarea>
      <button id="btn-steer-send" class="icon-btn send" aria-label="Send" disabled></button>
    </footer>
  </div>

  <!-- Hidden: tools, actions and session controls (kept so the script keeps working) -->
  <div hidden>
    <span id="bridge-status-badge" class="status-badge"><span id="bridge-status-text"></span></span>
    <div id="tabs-list"></div>
    <strong id="session-name"></strong>
    <span id="tab-status"></span>
    <button id="session-pin-status"></button>
    <span id="session-action-stats"></span>
    <button id="btn-toggle-pin"></button>
    <button id="btn-attach-tab"></button>
    <button id="btn-delete-session"></button>
    <section id="live-action-box">
      <span id="live-dot"></span>
      <span id="live-action-text"></span>
      <div id="activity-feed"></div>
    </section>
    <span id="composer-count"></span>
    <button id="btn-pause"></button>
    <button id="btn-stop"></button>
    <button id="btn-restart"></button>
    <button id="btn-take-over"></button>
  </div>

  <div id="panel-notice" class="panel-notice" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="delete-dialog">
    <form method="dialog">
      <h2 id="delete-dialog-title">Delete this session?</h2>
      <button value="cancel">Cancel</button>
      <button value="confirm">Delete</button>
    </form>
  </dialog>

  <script src="sidepanel.js"></script>
</body>
</html>
