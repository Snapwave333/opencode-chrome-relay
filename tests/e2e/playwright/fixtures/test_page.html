<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OpenCode Relay Target Page</title>
  <style>
    body { font-family: sans-serif; padding: 40px; margin: 0; min-height: 2000px; background: #fafafa; }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    button { padding: 10px 16px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
    input { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>OpenCode Relay Target Interactive Page</h2>
    <button id="target-button" aria-label="Confirm Purchase">Confirm Purchase</button>
    <output id="click-count" aria-label="Click count">0</output>
    <input id="target-input" type="text" placeholder="Enter username..." aria-label="Username field" />
    <select id="plan-select" aria-label="Plan">
      <option value="free">Free</option>
      <option value="pro">Pro</option>
      <option value="team">Team</option>
    </select>
    <output id="plan-choice" aria-label="Selected plan">free</output>
    <div style="height: 1200px; background: #eee; padding: 20px;">Scrollable content area</div>
  </div>
  <script>
    document.getElementById("target-button").addEventListener("click", () => {
      const counter = document.getElementById("click-count");
      counter.textContent = String(Number(counter.textContent) + 1);
    });
    document.getElementById("plan-select").addEventListener("change", (event) => {
      document.getElementById("plan-choice").textContent = event.target.value;
    });
  </script>
</body>
</html>
